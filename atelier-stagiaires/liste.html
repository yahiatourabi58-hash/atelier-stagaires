<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f6fb;margin:0;padding:24px}
    h1{text-align:center}
    nav{text-align:center;margin-bottom:20px}
    nav a{color:#3b5bdb;text-decoration:none}
    #liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:960px;margin:auto}
    .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);text-align:center}
    .card img{width:100%;height:200px;object-fit:cover;background:#e9ecef}
    .card div{padding:12px}
    .ville{color:#666}
  </style>
</head>
<body>
  <h1>Liste des stagiaires</h1>
  <nav><a href="index.html">← Nouvelle inscription</a></nav>
  <div id="liste">Chargement...</div>

  <script>
    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

    async function charger() {
      const conteneur = document.getElementById('liste');
      try {
        const res = await fetch('/api/liste.php');
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        if (json.data.length === 0) { conteneur.textContent = 'Aucun stagiaire.'; return; }

        conteneur.innerHTML = json.data.map(s => `
          <div class="card">
            <img src="${esc(s.photo)}" alt="Photo de ${esc(s.prenom)}">
            <div>
              <strong>${esc(s.prenom)} ${esc(s.nom)}</strong>
              <div class="ville">${esc(s.ville)}</div>
            </div>
          </div>`).join('');
      } catch (e) {
        conteneur.textContent = 'Erreur de chargement.';
      }
    }
    charger();
  </script>
</body>
</html>
